# IdleTrigger 配置示例 / Configuration Example
# 常用设置可直接在应用界面中完成；如需手工维护，复制为 IdleTrigger.toml 并放在 EXE 同目录
# Common settings are available in the app UI; for manual maintenance, copy this file to IdleTrigger.toml beside the EXE

# -- 保持唤醒 / Stay Awake --
# 手动启用保持唤醒，阻止系统自动睡眠 / Manually keep the system awake and prevent automatic sleep
nosleep_enabled = false
# 保持唤醒时同步保持屏幕常亮 / Keep the display on while Stay Awake is active
keep_screen_on = false
# 电池供电时仍允许保持唤醒 / Allow Stay Awake while running on battery
nosleep_on_battery = false
# 电池电量低于此百分比时暂停保持唤醒，不改写手动开关 / Pause Stay Awake below this battery percentage without changing the manual toggle
nosleep_battery_threshold = 20
# 工作站锁定期间暂停保持唤醒，解锁后按原状态恢复 / Pause Stay Awake while the workstation is locked; the previous state resumes on unlock
nosleep_pause_on_lock = false

# -- 自动任务 / Automatic Tasks --
# 自动任务仅在 IdleTrigger 运行时生效；状态操作只临时覆盖运行状态，且只能执行内置操作，不会启动命令或脚本 / Automatic tasks work only while IdleTrigger is running; state actions are temporary runtime overrides, and only built-in actions are available—commands and scripts are never launched
automation_enabled = true
# 任务建议通过任务管理器创建；列表按进程名匹配全部同名实例，也可浏览选择指定 EXE，PID 与文件描述不会写入规则 / Create tasks from the task manager; list choices match all same-name instances, or Browse can select a specific EXE; PIDs and file descriptions are never stored in rules
# 进程启动任务只在所选进程由无到有时触发；退出任务需所有同名实例退出并经过 5 秒宽限 / Process-start tasks fire only when selected processes change from none to any; exit tasks wait for all same-name instances plus a 5-second grace period
# 计划在指定分钟及下一分钟内仍可触发，超过此窗口不补执行；短于 5 秒扫描周期的进程可能漏检 / Schedules remain due during the specified minute and the next minute; later occurrences are skipped, and processes shorter than the 5-second scan interval may be missed
# 自动系统操作始终显示至少 10 秒的可取消倒计时 / Automatic system actions always show a cancellable countdown of at least 10 seconds
#
# 规则手工写法（通常由任务管理器维护，无需手写）。一条完整示例：
# Manual rule layout (normally maintained by the task manager). One full example:
#
# [[automation_rules]]
# id = "rule-evening-lock"            # 唯一标识，改写规则时保持不变 / unique id, keep stable across edits
# name = "晚间锁定"                    # 显示名称，留空时自动生成 / display name, auto-generated when empty
# enabled = true
# action = "lock"                     # stay_awake | pause_stay_awake | enable_idle_monitor | pause_idle_monitor
#                                     # | lock | sleep | hibernate | shutdown | restart | screen_off | logoff
# trigger = "daily"                   # process_running | process_started | process_exited | time_window | once
#                                     # | daily | weekly | session_locked | session_unlocked | on_resume | battery_below
# time = "23:30"                      # HH:MM；time_window 为开始时间 / HH:MM; the window start for time_window
# end_time = ""                       # 仅 time_window 使用 / only used by time_window
# date = ""                           # 仅 once 使用，YYYY-MM-DD / only used by once, YYYY-MM-DD
# days = ["mon", "tue", "wed", "thu", "fri"]  # 仅 weekly / time_window 使用 / only weekly and time_window
# process_logic = ""                  # any | all | none，仅含进程条件时有意义 / any | all | none
# keep_screen_on = false              # 仅 stay_awake 动作 / only for stay_awake
# idle_minutes = 0                    # 仅 enable_idle_monitor 动作 / only for enable_idle_monitor
# warning_seconds = 60                # 系统动作倒计时秒数 / countdown seconds for system actions
# blocked_policy = ""                 # skip | wait，到点进程条件未满足时 / skip | wait when the condition misses
# max_wait_minutes = 0                # 仅 wait 策略 / only for wait
# battery_level = 0                   # 仅 battery_below 触发（百分比）/ only for battery_below (percent)
#
# [[automation_rules.processes]]      # 进程条件（名称或路径二选一）/ process condition (name or exact path)
# match = "name"                      # name | path
# executable = "game.exe"
# path = ""                           # 仅 match = "path" 时填写 / only used when match = "path"
#

# -- 空闲监测 / Idle Monitoring --
# 手动启用空闲监测；关闭时仍保留下方参数供下次启用 / Manually enable idle monitoring; settings below are retained while disabled
idle_enabled = false
# 空闲时长：无键鼠操作多少分钟后触发动作 / Idle time in minutes before triggering after no keyboard or mouse input
idle_timeout_minutes = 30
# 达到空闲时长后执行的动作 / Action to run after the idle time is reached: "sleep", "hibernate", "shutdown", "lock", "restart", "screen_off"
idle_action = "sleep"
# 触发前多少秒显示不抢焦点的倒计时提醒窗口；键鼠操作或关闭提醒会取消本次动作，最少 10 秒 / Seconds before trigger to show a non-activating countdown window; keyboard/mouse input or closing it cancels this action, 10 seconds minimum
idle_warning_seconds = 30
# 增强空闲监测：适合系统睡眠也被固定间隔空闲刷新干扰的机器；默认关闭，普通键鼠操作仍会重置计时 / Enhanced idle detection for machines where system sleep is disturbed by fixed-interval idle refreshes; off by default, and normal keyboard or mouse input still resets idle time
idle_enhanced_monitor = false

# -- 昼夜主题 / Day/Night Theme --
# 启用按时间自动切换 Windows 深浅色 / Automatically switch Windows light/dark theme by schedule
theme_switch_enabled = false
# 切换模式："fixed" 使用下方固定时间；"sunrise" 根据日出日落计算 / Mode: "fixed" uses times below; "sunrise" calculates sunrise/sunset
theme_mode = "sunrise"
# 浅色开始时间，HH:MM；fixed 模式使用，日出日落不可用时也作为兜底 / Light theme start time, HH:MM; used by fixed mode and as fallback when sunrise/sunset is unavailable
theme_light_time = "07:00"
# 深色开始时间，HH:MM；fixed 模式使用，日出日落不可用时也作为兜底 / Dark theme start time, HH:MM; used by fixed mode and as fallback when sunrise/sunset is unavailable
theme_dark_time = "19:00"
# 通过 https://ipwho.is/ 估算公网 IP 所在城市；成功结果仅内存缓存 24 小时，失败 30 分钟后重试；关闭或失败时按时区、UTC 偏移和默认位置依次回退 / Estimate the public IP city through https://ipwho.is/; successful results are cached in memory for 24 hours and failures retry after 30 minutes; falls back to timezone, UTC offset, then default location when off or unavailable
theme_ip_location_enabled = false
# 电池供电时自动切换深色，接入电源后按当前计划恢复 / Switch to dark on battery, then restore by schedule on AC power
theme_dark_on_battery = true
# 检测到全屏应用、演示模式或前台游戏活动时暂不自动切换主题 / Pause automatic theme switching during fullscreen apps, presentations, or foreground game activity
theme_skip_fullscreen = true
# 随昼夜切换应用的浅色/深色壁纸路径；留空表示不更改壁纸 / Wallpaper path applied with the light/dark switch; empty keeps it unchanged
# 路径含反斜杠时用单引号字面量字符串，如 theme_light_wallpaper = 'C:\walls\day.jpg' / With backslashes use single-quoted literal strings
# theme_light_wallpaper = ""
# theme_dark_wallpaper = ""
# 壁纸方案库（设置界面“外观联动”页添加；浅色/深色从库中选择）/ Wallpaper library (added on the Settings Appearance page; the light/dark rows pick from it)
# theme_wallpapers = []
# 随昼夜切换应用的已安装指针方案名（控制面板 → 鼠标 → 指针中的方案）；留空表示不更改 / Installed cursor-scheme name applied with the light/dark switch; empty keeps it unchanged
# theme_light_cursor_scheme = ""
# theme_dark_cursor_scheme = ""
# 昼夜切换首次修改前的壁纸/指针快照（首次应用时自动记录，外观页“恢复修改前的外观”的数据源；一般无需手工编辑）/ Wallpaper/cursor state before the first day/night switch (captured automatically on first application; feeds the appearance-page restore; no need to edit by hand)
# theme_restore_wallpaper = ""
# theme_restore_cursor = ""

# -- 右键菜单 / Context Menu --
# 在资源管理器右键菜单中加入「复制路径」子菜单与自定义打开规则；关闭即移除全部注册项 / Adds a copy-path cascade and custom open-with rules to the Explorer context menu; turning it off removes every registered entry
ctx_menu_enabled = false
# 显示内置「复制路径」子菜单（完整路径/文件名/所在文件夹） / Show the built-in copy-path cascade (full path / file name / parent folder)
ctx_copy_enabled = true
# 复制路径引号策略："auto" 含空格才加引号，"always" 始终加，"none" 从不加 / Quote policy: "auto" quotes only paths with spaces, "always" always, "none" never
ctx_copy_quote = "auto"
# 多选拼接分隔符："newline" 换行，"space" 空格 / Multi-selection join: "newline" or "space"
ctx_copy_separator = "newline"
# 仅 Windows 11：回退为经典右键菜单，让菜单项直接显示在第一层（切换会重启资源管理器） / Windows 11 only: roll back to the classic context menu so entries appear on the first level (switching restarts File Explorer)
ctx_win11_classic = false
# 将自定义规则收入「自定义规则」子菜单（分隔线需要此模式；存在分隔线时自动启用） / Group custom rules under one cascade submenu (separators need it; any separator forces it)
ctx_rules_submenu = false
#
# 自定义打开规则（通常由规则管理器维护）。一条完整示例：
# Custom open-with rules (normally maintained by the rule manager). One full example:
#
# 分隔线条目（仅子菜单模式下渲染为分割线） / A separator entry (renders as a line in submenu mode only):
# [[ctx_rules]]
# id = "sep-1"
# separator = true
#
# [[ctx_rules]]
# id = "reshack"                 # 唯一标识，程序生成，无需手写 / unique id, generated automatically
# title = "Resource Hacker 打开"   # 菜单标题 / menu title
# enabled = true
# scope = "file"                 # file | dir | file_dir | background | all
# patterns = ["*.exe", "*.dll"]  # 匹配的扩展名，空 = 全部 / extensions to match, empty = all
# command = 'D:\tools\reshack.exe'
# args = '"%1"'                  # %1/%L/%V = 选中项路径 / %1/%L/%V = selected path
# icon = ""                      # 留空自动取目标程序图标 / empty = target program's icon
# hidden_console = false         # 隐藏控制台窗口（py/bat 类） / hide the console window
# working_dir = ""               # 留空 = 选中项所在目录 / empty = the selection's folder
#

# -- 设置 / Settings --
# 每次显示控制面板时在后台检查一次 GitHub Releases 的新版本（每分钟最多一次；托盘菜单与设置中的手动检查不受此开关限制）；确认后自动下载、校验并重启更新 / Check GitHub Releases in the background each time the control panel is shown (at most once a minute; manual checks from the tray menu or settings ignore this switch); after one confirmation the update downloads, verifies, and restarts automatically
update_check_enabled = true
# 启用全局热键：Ctrl+Win+Shift+S 睡眠，Win+Shift+L 锁定，Win+Shift+N 切换保持唤醒，Win+Shift+D 切换昼夜 / Enable global hotkeys: Ctrl+Win+Shift+S sleep, Win+Shift+L lock, Win+Shift+N toggle Stay Awake, Win+Shift+D switch day/night
hotkeys_enabled = false
# 锁定键状态变化时显示短暂提示 / Briefly show Caps Lock, Num Lock and Scroll Lock state changes
lock_keys_enabled = false
# 分别选择需要提示的锁定键 / Select which lock keys show notifications
lock_keys_caps_enabled = true
lock_keys_num_enabled = true
lock_keys_scroll_enabled = true
# 全屏或演示期间隐藏提示，结束后不补弹 / Hide during fullscreen or presentations; do not replay skipped notices
lock_keys_skip_fullscreen = true
# 将调试日志写入 EXE 同目录的 IdleTrigger.log；每行带启动会话标识 / Write debug logs to IdleTrigger.log next to the EXE; each line includes a startup session ID
logging_enabled = false
# 界面语言："auto" 跟随系统，"en" 英文，"zh-CN" 简体中文 / UI language: "auto" follows OS, "en" English, "zh-CN" Simplified Chinese
language = "auto"
