name: Lint

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_INCREMENTAL: '0'

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the build number is the git commit count, and the
          # default depth-1 clone makes rev-list report 1.
          fetch-depth: 0

      - name: Toolchain components
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc,i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-msvc
          add-job-id-key: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: |
          cargo test --locked --workspace --all-features --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --all-features --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build supported Windows architectures
        env:
          IDLETRIGGER_VERSION: ci
          IDLETRIGGER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./build/build.ps1 -Architecture all

      - name: Verify release artifacts
        run: |
          ./.github/scripts/verify-windows-artifact.ps1 -Path dist/IdleTrigger-x64.exe -Architecture x64 -Version ci
          ./.github/scripts/verify-windows-artifact.ps1 -Path dist/IdleTrigger-x86.exe -Architecture x86 -Version ci

      - name: Build devtools variant
        env:
          IDLETRIGGER_VERSION: ci
          IDLETRIGGER_BUILD_NUMBER: ${{ github.run_number }}
        run: cargo build --locked --release --features devtools --target x86_64-pc-windows-msvc

  msrv:
    name: Rust 1.88 compatibility
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - name: Check both architectures on minimum Rust
        run: |
          cargo check --locked --workspace --all-targets --all-features --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --workspace --all-targets --all-features --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
