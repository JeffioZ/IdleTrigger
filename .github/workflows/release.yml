name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Toolchain components
        run: |
          rustup component add clippy rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate release tag
        run: |
          # Port of tools/validate-release-tag.ps1: strict SemVer vMAJOR.MINOR.PATCH
          # with Windows uint16 version components.
          $tag = $env:RELEASE_TAG
          $semVerPattern = '^v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)(?:-(?<prerelease>(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+(?<build>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          if (-not [regex]::IsMatch($tag, $semVerPattern)) {
            Write-Error "Release tag '$tag' is not strict SemVer in the form vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]."
            exit 1
          }
          $version = $tag.Substring(1)
          foreach ($part in ([regex]::Matches($version, '[0-9]+') | Select-Object -First 4)) {
            if ([uint32]$part.Value -gt [uint16]::MaxValue) {
              Write-Error "Release tag '$tag' contains a Windows version component outside 0..65535."
              exit 1
            }
          }
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"

      - name: Verify
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        env:
          IDLETRIGGER_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/IdleTrigger.exe dist/IdleTrigger-x64.exe -Force
          cargo build --release --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/i686-pc-windows-msvc/release/IdleTrigger.exe dist/IdleTrigger-x86.exe -Force

      - name: Checksums
        run: |
          $lines = @()
          foreach ($file in @("dist/IdleTrigger-x86.exe", "dist/IdleTrigger-x64.exe")) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            $lines += "$hash *$([System.IO.Path]::GetFileName($file))"
          }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "SHA256SUMS.txt"),
            $content,
            [System.Text.Encoding]::ASCII
          )

      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: IdleTrigger ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/IdleTrigger-x86.exe
            dist/IdleTrigger-x64.exe
            SHA256SUMS.txt
          # Release notes are hand-written bilingual; disable auto-generation
          # so the draft never mixes in English-only notes that must be
          # cleared before filling the template.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
