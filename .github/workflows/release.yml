name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  RUSTUP_TOOLCHAIN: stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Toolchain components
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc,i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate release tag
        run: |
          # SemVer labels/metadata do not enter the fixed Windows version.
          $tag = $env:RELEASE_TAG
          $semVerPattern = '^v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)(?:-(?<prerelease>(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+(?<build>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          $parsed = [regex]::Match($tag, $semVerPattern)
          if (-not $parsed.Success) {
            Write-Error "Release tag '$tag' is not strict SemVer in the form vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]."
            exit 1
          }
          $version = $tag.Substring(1)
          foreach ($part in 'major', 'minor', 'patch') {
            [uint16]$component = 0
            if (-not [uint16]::TryParse($parsed.Groups[$part].Value, [ref]$component)) {
              Write-Error "Release tag '$tag' contains a Windows version component outside 0..65535."
              exit 1
            }
          }
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value "RELEASE_PRERELEASE=$($parsed.Groups['prerelease'].Success.ToString().ToLowerInvariant())"

      - name: Verify
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --all-features --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --all-features --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        env:
          IDLETRIGGER_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/IdleTrigger.exe dist/IdleTrigger-x64.exe -Force
          cargo build --locked --release --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/i686-pc-windows-msvc/release/IdleTrigger.exe dist/IdleTrigger-x86.exe -Force

      - name: Verify release artifacts
        run: |
          ./.github/scripts/verify-windows-artifact.ps1 -Path dist/IdleTrigger-x64.exe -Architecture x64 -Version $env:RELEASE_VERSION
          ./.github/scripts/verify-windows-artifact.ps1 -Path dist/IdleTrigger-x86.exe -Architecture x86 -Version $env:RELEASE_VERSION

      - name: Checksums
        run: |
          $lines = @()
          foreach ($file in @("dist/IdleTrigger-x86.exe", "dist/IdleTrigger-x64.exe")) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            $lines += "$hash *$([System.IO.Path]::GetFileName($file))"
          }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "SHA256SUMS.txt"),
            $content,
            [System.Text.Encoding]::ASCII
          )

      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: IdleTrigger ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/IdleTrigger-x86.exe
            dist/IdleTrigger-x64.exe
            SHA256SUMS.txt
          # Release notes are hand-written bilingual; disable auto-generation
          # so the draft never mixes in English-only notes that must be
          # cleared before filling the template.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
