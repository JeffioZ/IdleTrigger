[workspace]
resolver = "2"
members = ["apps/idletrigger", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JeffioZ/idletrigger"

[workspace.dependencies]
idletrigger-core = { path = "crates/core" }
tray-icon = "0.25"
winresource = "0.1"
toml_edit = { version = "0.25", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Com",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_Networking_WinHttp",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_Security",
] }

# Release profile tuned for a small self-contained EXE.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
