[package]
name = "idletrigger"
description = "Lightweight native Windows power automation tray utility"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
devtools = []

# Go parity: the shipped binary is IdleTrigger-<arch>.exe at packaging time;
# the raw cargo output keeps the product name.
[[bin]]
name = "IdleTrigger"
path = "src/main.rs"

[dependencies]
idletrigger-core = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tray-icon = { workspace = true }
windows = { workspace = true }

[build-dependencies]
winresource = { workspace = true }
